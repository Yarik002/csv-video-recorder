# Apache site for the video service (copied to /etc/apache2/sites-available/ by the Dockerfile).
# The Flask app runs through mod_wsgi, the videos are sent by Apache itself.

<VirtualHost *:80>
    ServerName localhost

    # Both logs go to the container output (docker compose logs web), see the Dockerfile.
    # The healthcheck (curl -A healthcheck) is not logged every 10 seconds.
    SetEnvIf User-Agent "^healthcheck$" dontlog
    CustomLog ${APACHE_LOG_DIR}/access.log combined env=!dontlog
    ErrorLog ${APACHE_LOG_DIR}/error.log

    # The Flask app runs in its own daemon processes (2 processes x 15 threads, user www-data).
    # python-home is the venv with Flask, psycopg2 and mod_wsgi, built for the image's Python.
    WSGIDaemonProcess video-service processes=2 threads=15 python-home=/opt/venv python-path=/app home=/app display-name=%{GROUP}
    WSGIProcessGroup video-service
    WSGIApplicationGroup %{GLOBAL}

    # Videos straight from disk: Apache answers Range requests, Python is not involved.
    # Listed before WSGIScriptAlias / so /media/ never reaches Flask.
    # (The Flask route /media/ stays for "python web_service.py" without Docker.)
    Alias /media/ /app/uploads/
    <Directory /app/uploads>
        Options None
        AllowOverride None
        Require all granted
        # Unfinished uploads (.upload-*.part) are not served.
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>

    # process-group and application-group make mod_wsgi load web_service.wsgi when the
    # daemon process starts, not on the first request: the app connects to the database
    # (and waits for it) and creates the table before it answers anything.
    WSGIScriptAlias / /app/web_service.wsgi process-group=video-service application-group=%{GLOBAL}
    <Directory /app>
        <Files web_service.wsgi>
            Require all granted
        </Files>
    </Directory>
</VirtualHost>
