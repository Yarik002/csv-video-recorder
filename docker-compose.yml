# Two containers: web (Apache + mod_wsgi + the Flask service) and db (PostgreSQL 16).
# Start: copy .env.example to .env, set DB_PASSWORD there, then "docker compose up --build".
# The password lives only in .env, which is not in git.

services:
  web:
    build: .
    ports:
      - "8000:80"              # http://localhost:8000 -> Apache on port 80 in the container
    volumes:
      - uploads:/app/uploads   # the videos survive "docker compose down"
    environment:
      DB_HOST: db              # the service name is the host name inside the Compose network
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-videos}
      DB_USER: ${DB_USER:-video_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set, copy .env.example to .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-A", "healthcheck", "http://localhost/videos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  db:
    image: postgres:16
    # No "ports": the database is reachable only from the web container.
    environment:
      POSTGRES_DB: ${DB_NAME:-videos}
      POSTGRES_USER: ${DB_USER:-video_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set, copy .env.example to .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 checks over TCP, like the web container connects. On the very first
      # start the image runs a temporary server on a Unix socket only while it creates
      # the database; over TCP the check waits for the real server.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
  uploads:
